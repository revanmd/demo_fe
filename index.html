<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-shapes">
  <span class="shape s1"></span>
  <span class="shape s2"></span>
  <span class="shape s3"></span>
</div>

<div class="card" id="card">
  <div class="brand">
    <div class="logo">N</div>
    <h1>Selamat Datang</h1>
    <p class="subtitle">Masuk untuk melanjutkan ke akun Anda</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M3 6.5C3 5.4 3.9 4.5 5 4.5H19C20.1 4.5 21 5.4 21 6.5V17.5C21 18.6 20.1 19.5 19 19.5H5C3.9 19.5 3 18.6 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M4 6.5L11.1 11.6C11.6 12 12.4 12 12.9 11.6L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
      </div>
      <span class="error" id="emailError"></span>
    </div>

    <div class="field">
      <label for="password">Kata Sandi</label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10.5V7.5C8 5.29 9.79 3.5 12 3.5C14.21 3.5 16 5.29 16 7.5V10.5" stroke="currentColor" stroke-width="1.5"/></svg>
        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required minlength="6">
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan kata sandi">
          <svg class="icon eye-open" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
          <svg class="icon eye-closed" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M3 3L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.9 5.1C10.6 5 11.3 4.9 12 4.9C18.5 4.9 22 11.4 22 11.4C22 11.4 20.9 13.4 18.8 15.2M6.4 6.6C3.7 8.4 2 11.4 2 11.4C2 11.4 5.5 17.9 12 17.9C13.4 17.9 14.6 17.6 15.7 17.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <span class="error" id="passwordError"></span>
    </div>

    <div class="row-between">
      <label class="checkbox">
        <input type="checkbox" id="remember">
        <span>Ingat saya</span>
      </label>
      <a href="#" class="link">Lupa kata sandi?</a>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span class="btn-text">Masuk</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <div class="divider"><span>atau lanjutkan dengan</span></div>

    <div class="social-row">
      <button type="button" class="social-btn" aria-label="Masuk dengan Google">
        <svg viewBox="0 0 48 48" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20.5H24V27.5H35.3C33.7 32.1 29.4 35.5 24 35.5C17.1 35.5 11.5 29.9 11.5 23C11.5 16.1 17.1 10.5 24 10.5C27.1 10.5 29.9 11.6 32.1 13.5L37.1 8.5C33.7 5.4 29.1 3.5 24 3.5C12.7 3.5 3.5 12.7 3.5 24C3.5 35.3 12.7 44.5 24 44.5C35.3 44.5 44.5 35.3 44.5 24C44.5 22.8 44.3 21.6 43.6 20.5Z"/><path fill="#FF3D00" d="M6.3 14.7L12.9 19.5C14.6 15.4 18.9 12.5 24 12.5C27.1 12.5 29.9 13.6 32.1 15.5L37.1 10.5C33.7 7.4 29.1 5.5 24 5.5C16.4 5.5 9.8 9.6 6.3 14.7Z"/><path fill="#4CAF50" d="M24 44.5C29 44.5 33.5 42.7 36.9 39.7L31.3 35C29.4 36.4 26.9 37.3 24 37.3C18.9 37.3 14.6 34.3 12.9 30.2L6.3 35.1C9.7 40.4 16.4 44.5 24 44.5Z"/><path fill="#1976D2" d="M43.6 20.5H42V20.5H24V27.5H35.3C34.6 29.8 33.1 31.8 31.3 33.2L31.3 33.2L36.9 37.9C40.6 34.5 43.5 29.6 43.5 24C43.5 22.8 44.3 21.6 43.6 20.5Z"/></svg>
      </button>
      <button type="button" class="social-btn" aria-label="Masuk dengan GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25C2 16.77 4.87 20.6 8.84 21.94C9.34 22.03 9.5 21.71 9.5 21.43C9.5 21.19 9.49 20.4 9.49 19.55C7 20.06 6.35 18.94 6.15 18.35C6.03 18.05 5.53 17.15 5.09 16.91C4.73 16.72 4.21 16.21 5.08 16.2C5.9 16.19 6.48 16.98 6.68 17.29C7.62 18.9 9.11 18.45 9.68 18.18C9.77 17.5 10.04 17.05 10.34 16.79C7.94 16.53 5.44 15.57 5.44 11.72C5.44 10.62 5.82 9.71 6.7 9.01C6.58 8.75 6.24 7.71 6.8 6.34C6.8 6.34 7.67 6.07 9.5 7.3C10.27 7.09 11.09 6.98 11.91 6.98C12.73 6.98 13.55 7.09 14.32 7.3C16.15 6.06 17.02 6.34 17.02 6.34C17.58 7.71 17.24 8.75 17.12 9.01C18 9.71 18.38 10.61 18.38 11.72C18.38 15.58 15.87 16.53 13.47 16.79C13.85 17.11 14.18 17.75 14.18 18.72C14.18 20.11 14.17 21.08 14.17 21.43C14.17 21.71 14.33 22.04 14.82 21.94C16.8 21.27 18.53 20.06 19.77 18.42C21.02 16.79 21.7 14.79 21.7 12.72C21.7 6.58 17.22 2 12 2Z"/></svg>
      </button>
      <button type="button" class="social-btn" aria-label="Masuk dengan Apple">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.4 1.2c.1 1.1-.3 2.1-1 2.9-.7.8-1.8 1.5-2.9 1.4-.1-1.1.3-2.2 1-3 .7-.8 1.9-1.4 2.9-1.3zM20 17.1c-.4.9-.8 1.7-1.4 2.5-.8 1.1-1.7 2.4-3.1 2.4-1.3 0-1.7-.8-3.1-.8-1.5 0-1.9.8-3.2.8-1.3 0-2.3-1.2-3.1-2.3-2.1-2.9-3.7-8.2-1.6-11.8 1-1.8 2.9-2.9 4.7-2.9 1.3 0 2.2.9 3.3.9 1.1 0 1.8-.9 3.3-.9 1.3 0 2.6.7 3.6 1.9-3.1 1.8-2.6 6.3.6 7.2-.2.7-.6 1.3-1 2z"/></svg>
      </button>
    </div>

    <p class="signup-text">Belum punya akun? <a href="#" class="link strong">Daftar sekarang</a></p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
